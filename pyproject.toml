[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m3gast3gg"
version = "3.0.0"
description = "M3GA-ST3GG — steganography toolkit + MCP server. Hide anything in any file, across every modality."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "M3GA-ST3GG Contributors" }]
keywords = ["mcp", "steganography", "lsb", "ctf", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scapy>=2.5.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    # MCP is core here — same pin as siblings (mcp 2.0 dropped
    # mcp.server.fastmcp, which server.py imports).
    "mcp>=1.2.0,<2",
    "uvicorn>=0.24.0",
    "starlette>=0.31.0",
]

[project.optional-dependencies]
web        = ["nicegui>=1.4.0", "fastapi>=0.100.0", "streamlit>=1.28.0"]
crypto     = ["cryptography>=41.0.0"]
jpeg       = ["jpeglib>=1.0"]
metadata   = ["piexif>=1.1"]
pdf        = ["pypdf>=4.0"]
dev        = ["pytest>=7.0", "pytest-asyncio>=0.23.0"]
all = [
    "nicegui>=1.4.0", "fastapi>=0.100.0", "streamlit>=1.28.0",
    "cryptography>=41.0.0", "jpeglib>=1.0", "piexif>=1.1", "pypdf>=4.0",
]

[project.scripts]
m3gast3gg-mcp       = "m3gast3gg.__main__:main"
m3gast3gg-mcp-stdio = "m3gast3gg.server:main_stdio"
stegg               = "m3gast3gg.cli:main_cli"
stegg-web           = "m3gast3gg.webui.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m3gast3gg"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge"                     = "m3gast3gg/_knowledge"
"src/m3gast3gg/field_guide.md"  = "m3gast3gg/field_guide.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/m3gast3gg",
    "knowledge",
    "skills",
    "docs",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
python_files   = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: takes multiple seconds",
    "crypto: requires the cryptography package",
    "pipeline: end-to-end multi-tool pipeline test",
    "regenerates_examples: writes artifacts under examples/pipelines/",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = "-ra --strict-markers"
